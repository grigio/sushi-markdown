name: Build Arch package

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: pacman -Syu --noconfirm --needed base-devel git github-cli

      - name: Check dependencies exist in the official repos
        # catches renames like webkit2gtk-6.0 -> webkitgtk-6.0 before makepkg fails
        run: |
          set -euo pipefail
          deps=$(bash -c '. ./PKGBUILD; echo "${depends[@]}"')
          for dep in $deps; do
            name=${dep%%[><=]*}
            echo "checking $name"
            pacman -Si "$name" > /dev/null
          done

      - name: Create unprivileged build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: su builder -c "cd '$GITHUB_WORKSPACE' && makepkg -f --noconfirm --nodeps --cleanbuild"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp *.pkg.tar.zst dist/
          # pacman repo database, so the release can be used as a [sushi-markdown] repo
          repo-add dist/sushi-markdown.db.tar.gz dist/*.pkg.tar.zst
          cp dist/sushi-markdown.db.tar.gz dist/sushi-markdown.db
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: sushi-markdown-package
          path: dist/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "sushi-markdown $tag" \
            --generate-notes \
          || gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
